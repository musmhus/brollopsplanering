<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bordsplacering</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #f7f4ee;
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 {
    font-family: 'Caveat', 'Segoe Print', cursive;
    color: #1d5fb8;
    font-size: 54px;
    margin: 24px 0 0;
    letter-spacing: 2px;
  }
  svg { width: 100%; max-width: 1500px; height: auto; display: block; }
  .tableRect {
    fill: #ffffff;
    stroke: #1d5fb8;
    stroke-width: 2.5;
  }
  .seat { fill: #dbe6f5; stroke: #1d5fb8; stroke-width: 1.2; }
  .seatEmpty { fill: #f7f4ee; stroke: #1d5fb8; stroke-width: 1.2; stroke-dasharray: 3 3; }
  .bordName {
    font-family: 'Caveat', 'Segoe Print', cursive;
    font-weight: 700;
    fill: #1d5fb8;
    font-size: 40px;
    text-anchor: middle;
  }
  .bordCount { fill: #9a917f; font-size: 16px; text-anchor: middle; }
  .guest { fill: #8e2f3c; font-size: 22px; font-weight: 600; stroke: #f7f4ee; stroke-width: 5px; paint-order: stroke; }
  .guestNum { fill: #8a8578; font-size: 15px; font-weight: 400; }
  @media print { body { background: #fff; } }
  body.embed { background: transparent; overflow: hidden; }
  body.embed h1 { display: none; }
</style>
</head>
<body>
<h1>Bordsplacering</h1>
<svg id="scene" viewBox="0 0 1680 1560" role="img" aria-label="Bordsplacering med sex bord"></svg>

<script>
if (location.hash === "#embed") document.body.classList.add("embed");

// Samma positioner som på fotot:
// vänster kolumn: Bord 2, Brudparets bord (stående), Bord 1 (stående)
// höger kolumn: Bord 3, Bord 4, Bord 5
const tables = [
  { label: "Bord 2", cx: 380, cy: 290, len: 480, depth: 130,
    top:    [[43,"Tanya"],[12,"Matilda"],[45,"Ellen"],[9,"Michaela G"]],
    bottom: [[44,"Jakob"],[42,"Erik B"],[11,"David"],[10,"Erik J"]] },
  { label: "Bord 3", cx: 1180, cy: 290, len: 760, depth: 130,
    top:    [[13,"Theodor"],[7,"Daniela"],[46,"Lejla"],[31,"Carl"],[35,"Alexandra"],[37,"Grace"]],
    bottom: [[8,"Nadia"],[30,"Davi"],[16,"Jenny"],[36,"Johan"],[20,"Andrés"],[19,"Olivia"]] },

  { label: ["Brudparets", "bord ♡"], cx: 330, cy: 790, len: 300, depth: 200, vertical: true,
    top:    [[14,"Alina"],[15,"Mustafa"]],                 // vänster sida
    bottom: [null, null] },                                // lediga platser
  { label: "Bord 4", cx: 1180, cy: 790, len: 640, depth: 130,
    top:    [[41,"Celine"],[21,"Douglas"],[28,"Ali"],[5,"Michaela S"],[25,"Isak"]],
    bottom: [[22,"Ebba"],[18,"Andreas"],[17,"Julia"],[29,"Ayob"],[6,"Hjalmar"]] },

  { label: "Bord 1", cx: 330, cy: 1330, len: 400, depth: 180, vertical: true,
    top:    [[26,"Mohammad"],[1,"Mervi"],[3,"Mormor"]],     // vänster sida
    bottom: [[27,"Asmaa"],[2,"Peter"],[4,"Morfar"]] },      // höger sida
  { label: "Bord 5", cx: 1180, cy: 1330, len: 520, depth: 130,
    top:    [[24,"Jessica"],[40,"Eric"],[32,"Martin"],[38,"Farmor"]],
    bottom: [[23,"Mikael"],[39,"Olena"],[34,"Håkan"],[33,"Linda"]] },
];

const svgNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("scene");

function el(name, attrs, parent) {
  const n = document.createElementNS(svgNS, name);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

const SEAT_R = 13, SEAT_GAP = 22;

function seatPositions(count, length) {
  // jämnt fördelade längs långsidan
  const pos = [];
  for (let j = 0; j < count; j++) {
    pos.push(-length / 2 + (length / (count + 1)) * (j + 1));
  }
  return pos;
}

function guestText(g, x, y, guest, anchor) {
  const txt = el("text", { x, y, class: "guest", "text-anchor": anchor }, g);
  const numSpan = el("tspan", { class: "guestNum" }, txt);
  numSpan.textContent = guest[0] + ". ";
  const nameSpan = el("tspan", {}, txt);
  nameSpan.textContent = guest[1];
}

tables.forEach(t => {
  const cx = t.cx, cy = t.cy, L = t.len, S = t.depth;
  const g = el("g", {}, svg);
  const guestCount = [...t.top, ...t.bottom].filter(Boolean).length;

  if (!t.vertical) {
    // liggande bord: gäster längs över- och undersidan
    el("rect", { x: cx - L/2, y: cy - S/2, width: L, height: S, rx: 10, class: "tableRect" }, g);

    seatPositions(t.top.length, L).forEach((dx, j) => {
      const guest = t.top[j];
      const sy = cy - S/2 - SEAT_GAP;
      el("circle", { cx: cx + dx, cy: sy, r: SEAT_R, class: guest ? "seat" : "seatEmpty" }, g);
      if (guest) guestText(g, cx + dx, j % 2 ? sy - 68 : sy - 30, guest, "middle");
    });
    seatPositions(t.bottom.length, L).forEach((dx, j) => {
      const guest = t.bottom[j];
      const sy = cy + S/2 + SEAT_GAP;
      el("circle", { cx: cx + dx, cy: sy, r: SEAT_R, class: guest ? "seat" : "seatEmpty" }, g);
      if (guest) guestText(g, cx + dx, j % 2 ? sy + 82 : sy + 44, guest, "middle");
    });
  } else {
    // stående bord: gäster längs vänster och höger sida
    el("rect", { x: cx - S/2, y: cy - L/2, width: S, height: L, rx: 10, class: "tableRect" }, g);

    seatPositions(t.top.length, L).forEach((dy, j) => {
      const guest = t.top[j];
      const sx = cx - S/2 - SEAT_GAP;
      el("circle", { cx: sx, cy: cy + dy, r: SEAT_R, class: guest ? "seat" : "seatEmpty" }, g);
      if (guest) guestText(g, sx - 28, cy + dy + 6, guest, "end");
    });
    seatPositions(t.bottom.length, L).forEach((dy, j) => {
      const guest = t.bottom[j];
      const sx = cx + S/2 + SEAT_GAP;
      el("circle", { cx: sx, cy: cy + dy, r: SEAT_R, class: guest ? "seat" : "seatEmpty" }, g);
      if (guest) guestText(g, sx + 28, cy + dy + 6, guest, "start");
    });
  }

  const lines = Array.isArray(t.label) ? t.label : [t.label];
  const lbl = el("text", { x: cx, y: cy + 2 - (lines.length - 1) * 19, class: "bordName" }, g);
  lines.forEach((line, i) => {
    const span = el("tspan", { x: cx, dy: i ? 38 : 0 }, lbl);
    span.textContent = line;
  });
  const cnt = el("text", { x: cx, y: cy + 26 + (lines.length - 1) * 21, class: "bordCount" }, g);
  cnt.textContent = guestCount + " gäster";
});
</script>
</body>
</html>
